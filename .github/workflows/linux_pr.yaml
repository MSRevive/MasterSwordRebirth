name: Linux PR Compile Check

on:
  pull_request:
    branches:
      - "dev"
    types: [review_requested, ready_for_review]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repsoitory
        uses: actions/checkout@v4

      - name: Install G++ Multilib & 32 bit OpenGL library
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y g++-11-multilib libgcc-s1:i386 libstdc++6:i386 libgl1-mesa-dev:i386 pkg-config gcc-multilib g++-multilib

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3

      - name: Build
        run: ${{github.workspace}}/build-linux.sh -p ${{github.workspace}} -t ${{env.BUILD_TYPE}}
